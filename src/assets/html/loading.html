<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  @font-face {
    font-family: 'PLANK';
    src: url('../font/hypik.otf') format('opentype');
  }
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  #celeste {
    display: flex;
    gap: 0.6em;
  }
  #celeste span {
    font-family: 'PLANK', 'Impact', 'Arial Black', sans-serif;
    font-size: clamp(48px, 10vw, 96px);
    font-weight: 400;
    color: #ffffff;
    width: 0.7em;
    height: 1.2em;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }
</style>
</head>
<body>
<div id="celeste"></div>
<script>
  const WORD = "CELESTE";
  const CHARS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#@!&%$?";
  const container = document.getElementById("celeste");

  const spans = WORD.split("").map(c => {
    const s = document.createElement("span");
    s.textContent = CHARS[Math.floor(Math.random() * CHARS.length)];
    container.appendChild(s);
    return s;
  });

  let resolvedCount = 0;
  let scrambleTimer = null;

  function startScramble() {
    if (scrambleTimer) clearInterval(scrambleTimer);
    scrambleTimer = setInterval(() => {
      spans.forEach((s, i) => {
        if (i >= resolvedCount) {
          s.textContent = CHARS[Math.floor(Math.random() * CHARS.length)];
        }
      });
    }, 55);
  }

  window.__celesteProgress = function(step) {
    step = Math.max(0, Math.min(WORD.length, step));
    for (let i = resolvedCount; i < step; i++) {
      spans[i].textContent = WORD[i];
    }
    resolvedCount = step;
    if (resolvedCount >= WORD.length) {
      clearInterval(scrambleTimer);
      scrambleTimer = null;
    }
  };

  startScramble();
</script>
</body>
</html>
