<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    @font-face {
      font-family: 'PLANK';
      src: url('../font/hypik.otf') format('opentype');
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #222946;
      overflow: hidden;
      user-select: none;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #celeste {
      font-family: 'PLANK', 'Impact', 'Arial Black', sans-serif;
      font-size: 96px;
      font-weight: 400;
      color: #ffffffcf;
      white-space: nowrap;
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body>
  <div id="celeste">CELESTE</div>
</body>
</html>
